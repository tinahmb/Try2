<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corkboard navigation test</title>
<style>
  @font-face {
    font-family: 'BoldMoldHandwriting';
    src: url('fonts/BoldMoldHandwriting-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* the zoom effect needs a fixed viewport, no page scroll */
  }

  /* ---- Same background setup that already works — untouched ---- */
  .viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .board {
    width: 100%;
    height: 100%;
    background-image: url('images/corkboard.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    transform: scale(1);
    transform-origin: 0% 0%; /* overwritten per-quadrant by JS when zoomed */
    transition: transform 0.6s ease;
  }

  /* ---- The 4 quadrants (visual containers only — not clickable
     themselves; navigation happens via the hit-zone divs below) ---- */
  .quad {
    position: absolute;
    width: 50%;
    height: 50%;
    /* Uncomment the line below while testing, to see the quadrant
       boundaries. Delete it once you're happy with the zoom areas. */
    /* outline: 2px dashed red; */
  }
  .quad[data-quad="1"] { top: 0;   left: 0; }    /* top-left */
  .quad[data-quad="2"] { top: 0;   left: 50%; }  /* top-right */
  .quad[data-quad="3"] { top: 50%; left: 50%; }  /* bottom-right */
  .quad[data-quad="4"] { top: 50%; left: 0; }    /* bottom-left */

  /* Both quad boxes stay their true, even 50/50 size — nothing here
     resizes or scales anything, so your PNGs stay exactly as made.
     The bottom row is moved up as a group with a plain position shift
     only. One variable controls how far; raise it to move further up,
     lower it to move less. */
  :root { --bottom-row-lift: 8%; }
  .quad[data-quad="3"], .quad[data-quad="4"] {
    top: calc(50% - var(--bottom-row-lift));
  }

  /* Every element image is quadrant-sized (Photoshop-exported to match
     the quad exactly), so each one just fills its .quad edge-to-edge.
     Stacking order = DOM order below: later element = visually on top.
     No manual positioning per element — the artwork's own transparency
     already places things correctly within that quadrant canvas. */
  .quad img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill; /* switch to "contain" if any PNG isn't an exact
                          pixel match for the quadrant */
    pointer-events: none; /* images are never click targets — the
                              arrow-hit divs above them handle clicks */
    transform: scale(0.92); /* shrinks each element a bit so it doesn't
                                touch the quadrant edges — tweak this one
                                number to adjust breathing room everywhere
                                at once */
    transform-origin: center center;
  }

  /* ---- Arrow hit-zones ----
     These are the ACTUAL click targets — small invisible boxes placed
     roughly where each arrow graphic sits, instead of the old approach
     of using the full-quad-sized arrow <img> itself (which overlapped
     100% with its sibling arrow and swallowed every click).

     Starting position is a rough guess: lower-left third of the quad
     for "left" arrows, lower-right third for "right" arrows. Nudge the
     top/left/width/height below per quad once you see it live against
     your real artwork — nothing else on the page depends on these
     values, so they're safe to tweak freely. */
  .arrow-hit {
    position: absolute;
    cursor: pointer;
    /* outline: 1px dashed lime; */ /* uncomment while nudging position */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arrow-hit .arrow-label {
    font-family: 'BoldMoldHandwriting', sans-serif;
    font-size: 22px;
    color: #222;
    pointer-events: none; /* label never blocks the click, the div does */
    user-select: none;
    text-align: center;
  }

  /* Generic default placement — only used now by the two whole-view
     arrows (quad 1 left, quad 4 left), since we don't have their real
     artwork positions yet. Everything else below is measured from the
     actual arrow images and overridden per quad/side. */
  .arrow-hit[data-side="left"]  { top: 70%; left: 8%;  width: 18%; height: 14%; }
  .arrow-hit[data-side="right"] { top: 70%; right: 8%; width: 18%; height: 14%; }

  /* ---- Measured positions for the 6 labeled arrows ----
     Percentages are relative to each arrow's own .quad box. Nudge these
     numbers directly once you see the live page against your real
     corkboard/images assets. */
  .quad[data-quad="1"] .arrow-hit[data-side="right"] {
    left: 74%; top: 4%; width: 23%; height: 13%; right: auto;
  }
  .quad[data-quad="2"] .arrow-hit[data-side="left"] {
    left: 10%; top: 7%; width: 22%; height: 11%;
  }
  .quad[data-quad="2"] .arrow-hit[data-side="right"] {
    left: 84%; top: 57%; width: 6%; height: 40%; right: auto;
  }
  .quad[data-quad="3"] .arrow-hit[data-side="right"] {
    left: 60%; top: 5%; width: 22%; height: 13%; right: auto;
  }
  .quad[data-quad="3"] .arrow-hit[data-side="left"] {
    left: 4%; top: 3%; width: 24%; height: 11%;
  }
  .quad[data-quad="4"] .arrow-hit[data-side="right"] {
    left: 67%; top: 3%; width: 24%; height: 12%; right: auto;
  }

  /* The quad-2 right arrow is a vertical downward strip, not a
     horizontal ribbon like the others — its label needs to run
     top-to-bottom along the strip instead of sitting horizontally. */
  .quad[data-quad="2"] .arrow-hit[data-side="right"] .arrow-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="board" id="board">
    <div class="quad" data-quad="1">
      <img src="images/slide1-torn-paper-notebook.png" alt="">
      <img src="images/slide1-pin-blue.png" alt="">
      <img src="animations/slide1-anim1.png" alt="">
      <img src="images/slide1-torn-paper-photo.png" alt="">
      <img src="images/slide1-photo.png" alt="">
      <img src="images/slide1-pin-yellow.png" alt="">
      <img src="images/slide1-sticky-arrow-left.png" alt="">
      <img src="images/slide1-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Next</span></div>
    </div>
    <div class="quad" data-quad="2">
      <img src="animations/slide2-anim2.png" alt="">
      <img src="images/slide2-tape.png" alt="">
      <img src="images/slide2-sticky-pink-back.png" alt="">
      <img src="images/slide2-sticky-pink-front.png" alt="">
      <img src="images/slide2-sticky-blue.png" alt="">
      <img src="images/slide2-sticky-arrow-left.png" alt="">
      <img src="images/slide2-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label">Back</span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Next</span></div>
    </div>
    <div class="quad" data-quad="3">
      <img src="images/slide3-torn-paper-anim4.png" alt="">
      <img src="images/slide3-tape.png" alt="">
      <img src="images/slide3-sticky-yellow.png" alt="">
      <img src="images/slide3-torn-paper-scribble.png" alt="">
      <img src="images/slide3-paperclip.png" alt="">
      <img src="images/slide3-sticky-green.png" alt="">
      <img src="images/slide3-sticky-arrow-left.png" alt="">
      <img src="images/slide3-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label">Next</span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Back</span></div>
    </div>
    <div class="quad" data-quad="4">
      <img src="images/slide4-sticky-magenta.png" alt="">
      <img src="images/slide4-sticky-purple.png" alt="">
      <img src="images/slide4-sticky-arrow-left.png" alt="">
      <img src="images/slide4-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Back</span></div>
    </div>
  </div>
</div>

<script>
  // Where the board should "hinge" from when zooming into each quadrant,
  // so that quadrant fills the whole screen after scaling up.
  //
  // Quads 3 and 4 are shifted UP from their natural 50% position (see
  // --bottom-row-lift in the CSS, used to close the gap between rows in
  // whole-view). That shift means the plain "100%" vertical origin used
  // for an unshifted quadrant would overshoot — the math below corrects
  // for it automatically: for a box starting at top = T% with the same
  // 50% height, the correct origin is 2*T%. Reading --bottom-row-lift
  // directly from the CSS (instead of hardcoding a second copy of the
  // number here) means the two can never drift out of sync if that
  // variable is ever changed.
  const liftPercent = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--bottom-row-lift')
  ) || 0;
  const bottomRowTop = 50 - liftPercent;       // actual top %, e.g. 42
  const bottomRowOriginY = 2 * bottomRowTop;   // correct zoom origin, e.g. 84%

  const ORIGIN = {
    1: '0% 0%',    // top-left
    2: '100% 0%',  // top-right
    3: `100% ${bottomRowOriginY}%`, // bottom-right
    4: `0% ${bottomRowOriginY}%`,   // bottom-left
  };

  // Fixed routing table for every arrow. 'whole' means "go to whole
  // view" — except for the two arrows whose fixed destination IS whole
  // view (1-left, 4-left): when the user is already in whole view,
  // clicking those instead zooms into the quadrant that arrow lives on
  // (handled as a special case in goToDestination, not listed here).
  const ARROW_DESTINATION = {
    '1-left':  'whole',
    '1-right': 2,
    '2-left':  1,
    '2-right': 3,
    '3-left':  4,
    '3-right': 2,
    '4-left':  'whole',
    '4-right': 3,
  };

  const board = document.getElementById('board');
  let currentQuad = 1; // site opens already zoomed into quad 1

  function zoomTo(quadNumber) {
    currentQuad = quadNumber;
    board.style.transformOrigin = ORIGIN[quadNumber];
    board.style.transform = 'scale(2)';
  }

  function zoomOut() {
    currentQuad = null;
    board.style.transform = 'scale(1)';
  }

  function goToDestination(ownQuad, destination) {
    if (destination === 'whole') {
      if (currentQuad === null) {
        // Already in whole view: this arrow's normal destination is
        // whole view, so instead zoom into the quadrant it belongs to.
        zoomTo(ownQuad);
      } else {
        zoomOut();
      }
      return;
    }
    zoomTo(destination);
  }

  // Wire up every arrow hit-zone div (the actual click targets).
  document.querySelectorAll('.arrow-hit').forEach(hit => {
    const quadNumber = parseInt(hit.closest('.quad').dataset.quad, 10);
    const side = hit.dataset.side; // 'left' or 'right'
    const key = `${quadNumber}-${side}`;
    const destination = ARROW_DESTINATION[key];

    hit.addEventListener('click', () => {
      goToDestination(quadNumber, destination);
    });
  });

  // Initial load: apply the zoomed-in state for quad 1 directly, with
  // no transition, so there's no flash of whole-view or visible
  // animation on first paint. The .board transition rule stays intact
  // for every zoom/zoomOut that happens after this.
  board.style.transition = 'none';
  board.style.transformOrigin = ORIGIN[1];
  board.style.transform = 'scale(2)';
  // Force the browser to apply the above before re-enabling the
  // transition, so it doesn't get animated retroactively.
  board.offsetHeight; // reflow
  board.style.transition = 'transform 0.6s ease';
</script>

</body>
</html>
