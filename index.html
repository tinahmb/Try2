<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corkboard navigation test</title>
<link rel="preload" href="fonts/BoldMoldHandwriting-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Handwriting2-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: 'BoldMoldHandwriting';
    src: url('fonts/BoldMoldHandwriting-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: block;
  }

  @font-face {
    font-family: 'Handwriting2';
    src: url('fonts/Handwriting2-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: block;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  .viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .board {
    width: 100%;
    height: 100%;
    background-image: url('images/corkboard.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    transform: scale(1);
    transform-origin: 0% 0%;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .quad {
    position: absolute;
    width: 50%;
    height: 50%;
  }
  .quad[data-quad="1"] { top: 0;   left: 0; }
  .quad[data-quad="2"] { top: 0;   left: 50%; }
  .quad[data-quad="3"] { top: 50%; left: 50%; }
  .quad[data-quad="4"] { top: 50%; left: 0; }

  :root { --bottom-row-lift: 8%; }
  .quad[data-quad="3"], .quad[data-quad="4"] {
    top: calc(50% - var(--bottom-row-lift));
  }

  .quad img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transform: scale(0.92);
    transform-origin: center center;
  }

  .arrow-hit {
    position: absolute;
    cursor: pointer;
  }

  .arrow-hit .arrow-label {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'BoldMoldHandwriting', sans-serif;
    font-size: 35px;
    color: rgba(34, 34, 34, 0.75);
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  .arrow-hit .arrow-label.is-hidden-label {
    opacity: 0;
  }

  .photo-unit {
    position: absolute;
    inset: 0;
    pointer-events: none; /* wrapper itself no longer the click target —
                              see .paper-hit below, sized to the real
                              paper shape instead of the whole quad */
    transform-origin: 50% 8%;
  }
  .photo-unit img {
    pointer-events: none;
  }
  .photo-unit.is-swinging {
    animation: photo-swing 0.6s ease-in-out;
  }
  .photo-unit.has-fallen {
    animation: photo-fall 0.7s cubic-bezier(0.55, 0, 0.85, 0.4) forwards;
    pointer-events: none;
  }

  /* Measured directly from each paper PNG's alpha-channel bounds —
     not guessed. Slide 1: slide1-torn-paper-photo.png. Slide 3:
     slide3-torn-paper-scribble.png. Each rectangle is a loose
     approximation of an irregular torn edge, so it's intentionally
     inset slightly (2%) from the exact measured box to avoid the
     hit-zone poking past the paper's jagged silhouette into empty
     cork background on the corners. */
  .paper-hit {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
    /* outline: 1px dashed lime; */ /* uncomment to see the zone while checking */
  }
  .photo-unit.has-fallen .paper-hit {
    pointer-events: none; /* otherwise this child's own explicit
                              "auto" would override the parent's
                              has-fallen "none" and stay clickable */
  }
  #slide1PhotoUnit .paper-hit {
    left: 61.20%; top: 17.43%; width: 36.00%; height: 72.54%;
  }
  #slide3PaperUnit .paper-hit {
    left: 15.87%; top: 19.48%; width: 30.84%; height: 62.77%;
  }
  @keyframes photo-swing {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(6deg); }
    50%  { transform: rotate(-5deg); }
    75%  { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
  }
  .fall-unit {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transform-origin: 50% 8%;
  }
  .fall-unit.has-fallen {
    animation: photo-fall 0.7s cubic-bezier(0.55, 0, 0.85, 0.4) forwards;
  }
  @keyframes photo-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(140%) rotate(35deg); opacity: 0; }
  }

  .roll-unit {
    position: absolute;
    inset: 0;
    cursor: pointer;
    pointer-events: none;
    transform-origin: 50% 22%;
    transform: scaleY(1) skewX(0deg);
    transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .roll-unit img {
    pointer-events: none;
  }
  .roll-unit.is-peeled {
    transform: scaleY(0.18) skewX(-6deg);
  }
  .roll-unit.is-peeled {
    z-index: 10;
  }

  .roll-unit .roll-hit {
    position: absolute;
    left: 52%;
    top: 25%;
    width: 38%;
    height: 71%;
    pointer-events: auto;
  }

  .roll-unit .roll-hit.is-locked {
    pointer-events: none;
  }

  #slide3Yellow .roll-hit {
    left: 16%;
    top: 30%;
    width: 34%;
    height: 40%;
  }

  .sticky-label {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Handwriting2', sans-serif;
    font-size: 28px;
    letter-spacing: -1.5px; /* pulls characters closer together — make
                                more negative for tighter still, less
                                negative (closer to 0) to loosen it */
    color: rgba(34, 34, 34, 0.85);
    pointer-events: none;
    user-select: none;
    line-height: 1.15;
  }

  .arrow-hit[data-side="left"]  { top: 70%; left: 8%;  width: 18%; height: 14%; }
  .arrow-hit[data-side="right"] { top: 70%; right: 8%; width: 18%; height: 14%; }

  .quad[data-quad="1"] .arrow-hit[data-side="left"] {
    left: 23%; top: 14%; width: 21%; height: 9%;
  }
  .quad[data-quad="1"] .arrow-hit[data-side="right"] {
    left: 74%; top: 15%; width: 23%; height: 13%; right: auto;
  }
  .quad[data-quad="2"] .arrow-hit[data-side="left"] {
    left: 10%; top: 16%; width: 22%; height: 11%;
  }
  .quad[data-quad="2"] .arrow-hit[data-side="right"] {
    left: 82%; top: 53%; width: 6%; height: 40%; right: auto;
  }
  .quad[data-quad="3"] .arrow-hit[data-side="right"] {
    left: 60%; top: 14%; width: 22%; height: 13%; right: auto;
  }
  .quad[data-quad="3"] .arrow-hit[data-side="left"] {
    left: 8%; top: 14%; width: 24%; height: 11%;
  }
  .quad[data-quad="4"] .arrow-hit[data-side="left"] {
    left: 10%; top: 13%; width: 24%; height: 13%;
  }
  .quad[data-quad="4"] .arrow-hit[data-side="right"] {
    left: 67%; top: 13%; width: 24%; height: 12%; right: auto;
  }

  .quad[data-quad="2"] .arrow-hit[data-side="right"] .arrow-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }

  /* ============================================================
     ▼▼▼ TEMPORARY LABEL-EDITOR TOOL — delete this whole block
     (from here down to the matching "▲▲▲" comment) plus the
     matching <script> block at the bottom once labels are placed.
     Now covers BOTH .sticky-label AND .arrow-label ("Back"/"Next"),
     so the same drag/resize/export flow works on both.
     ============================================================ */
  body.label-edit-mode .sticky-label,
  body.label-edit-mode .arrow-label {
    pointer-events: auto;
    cursor: grab;
    outline: 2px dashed rgba(255, 0, 150, 0.9);
    background: rgba(255, 0, 150, 0.08);
    opacity: 1 !important; /* reveals the invisible "Board" arrow
                               labels too, so they can be positioned
                               even though they're normally hidden */
  }
  body.label-edit-mode .sticky-label:active,
  body.label-edit-mode .arrow-label:active { cursor: grabbing; }

  .label-resize-handle {
    position: absolute;
    right: -9px;
    bottom: -9px;
    width: 18px;
    height: 18px;
    background: #fff;
    border: 2px solid rgb(255, 0, 150);
    border-radius: 50%;
    cursor: nwse-resize;
    touch-action: none;
    display: none;
  }
  body.label-edit-mode .label-resize-handle { display: block; }

  #labelEditorToggle {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 999;
    background: rgb(255, 0, 150);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: sans-serif;
    font-size: 14px;
  }
  #labelExportBtn {
    position: fixed;
    bottom: 16px;
    left: 150px;
    z-index: 999;
    background: #222;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: sans-serif;
    font-size: 14px;
    display: none;
  }
  body.label-edit-mode #labelExportBtn { display: block; }

  #labelExportOutput {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    max-height: 60vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.9);
    color: #4ade80;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    z-index: 999;
    display: none;
  }
  #labelExportOutput.visible { display: block; }
  /* ▲▲▲ END TEMPORARY LABEL-EDITOR TOOL CSS ▲▲▲ */
</style>
</head>
<body>

<!-- ▼▼▼ TEMPORARY LABEL-EDITOR TOOL — delete this button + the one
     below it, and the <div id="labelExportOutput">, once done.
     Currently DISABLED via display:none on both buttons — flip that
     back to re-enable without needing to rebuild anything. ▼▼▼ -->
<button id="labelEditorToggle" type="button" style="display:none;">Edit label positions</button>
<button id="labelExportBtn" type="button" style="display:none;">Export positions</button>
<div id="labelExportOutput"></div>
<!-- ▲▲▲ END TEMPORARY LABEL-EDITOR TOOL BUTTONS ▲▲▲ -->

<div class="viewport">
  <div class="board" id="board">
    <div class="quad" data-quad="1">

        <img src="images/slide1-torn-paper-photo.png" alt="">
        <img src="images/slide1-photo.png" alt="">
        <div class="paper-hit"></div>
      </div>
      <img src="images/slide1-pin-yellow.png" alt="">
      <img src="images/slide1-sticky-arrow-left.png" alt="">
      <img src="images/slide1-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label is-hidden-label" data-label="Quad1 Board" style="left:10%; top:15%; width:80%; height:70%;">Board<div class="label-resize-handle"></div></span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label" data-label="Quad1 Next" style="left:10%; top:15%; width:80%; height:70%;">Next<div class="label-resize-handle"></div></span></div>
    </div>
    <div class="quad" data-quad="2">
      <img src="animations/slide2-anim2.png" alt="">
      <img src="images/slide2-tape.png" alt="">
      <img src="images/slide2-sticky-arrow-right.png" alt="">
      <img src="images/slide2-sticky-blue.png" alt="">
      <div class="sticky-label" data-label="Book Participation" style="left:13.888889%; top:22.527705%; width:36%; height:60%;">Book Participation<div class="label-resize-handle"></div></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label" data-label="Quad2 Next" style="left:10%; top:15%; width:80%; height:70%;">Next<div class="label-resize-handle"></div></span></div>
      <div class="roll-unit" id="slide2PinkBack">
        <img src="images/slide2-sticky-pink-back.png" alt="">
        <div class="roll-hit"></div>
        <div class="sticky-label" data-label="Brazilian Citizen Labs" style="left:52.37037%; top:16.952507%; width:38%; height:71%;">Brazilian Citizen Labs<div class="label-resize-handle"></div></div>
      </div>
      <div class="roll-unit" id="slide2PinkFront">
        <img src="images/slide2-sticky-pink-front.png" alt="">
        <div class="roll-hit"></div>
      </div>
      <img src="images/slide2-sticky-arrow-left.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label" data-label="Quad2 Back" style="left:10%; top:15%; width:96.625016%; height:77.796102%;">Back<div class="label-resize-handle"></div></span></div>
    </div>
    <div class="quad" data-quad="3">
      <img src="images/slide3-torn-paper-anim4.png" alt="">
      <img src="images/slide3-tape.png" alt="">
      <div class="roll-unit" id="slide3Yellow">
        <img src="images/slide3-sticky-yellow.png" alt="">
        <div class="roll-hit is-locked"></div>
        <div class="sticky-label" data-label="Electoral Observation Project" style="left:15.444444%; top:34.551451%; width:34%; height:40%;">Electoral Observation Project<div class="label-resize-handle"></div></div>
      </div>
      <div class="photo-unit" id="slide3PaperUnit">
        <img src="images/slide3-torn-paper-scribble.png" alt="">
        <div class="paper-hit"></div>
      </div>
      <div class="fall-unit" id="slide3ClipUnit">
        <img src="images/slide3-paperclip.png" alt="">
      </div>
      <img src="images/slide3-sticky-green.png" alt="">
      <div class="sticky-label" data-label="Selected Rough Dialogues" style="left:54.055556%; top:24.902375%; width:36%; height:60%;">Selected Rough Dialogues<div class="label-resize-handle"></div></div>
      <img src="images/slide3-sticky-arrow-left.png" alt="">
      <img src="images/slide3-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label" data-label="Quad3 Next" style="left:10%; top:15%; width:80%; height:70%;">Next<div class="label-resize-handle"></div></span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label" data-label="Quad3 Back" style="left:10%; top:15%; width:80%; height:70%;">Back<div class="label-resize-handle"></div></span></div>
    </div>
    <div class="quad" data-quad="4">
      <img src="images/slide4-sticky-magenta.png" alt="">
      <div class="sticky-label" data-label="MYOOZ InC" style="left:9.944444%; top:27.124011%; width:36%; height:55%;">MYOOZ Inc<div class="label-resize-handle"></div></div>
      <img src="images/slide4-sticky-purple.png" alt="">
      <div class="sticky-label" data-label="HR Index" style="left:54.287037%; top:27.585752%; width:36%; height:55%;">HR Index<div class="label-resize-handle"></div></div>
      <img src="images/slide4-sticky-arrow-left.png" alt="">
      <img src="images/slide4-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label is-hidden-label" data-label="Quad4 Board" style="left:10%; top:15%; width:80%; height:70%;">Board<div class="label-resize-handle"></div></span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label" data-label="Quad4 Back" style="left:10%; top:15%; width:80%; height:70%;">Back<div class="label-resize-handle"></div></span></div>
    </div>
  </div>
</div>

<script>
  const liftPercent = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--bottom-row-lift')
  ) || 0;
  const bottomRowTop = 50 - liftPercent;
  const bottomRowOriginY = 2 * bottomRowTop;

  const ORIGIN = {
    1: '0% 0%',
    2: '100% 0%',
    3: `100% ${bottomRowOriginY}%`,
    4: `0% ${bottomRowOriginY}%`,
  };

  const ARROW_DESTINATION = {
    '1-left':  'whole',
    '1-right': 2,
    '2-left':  1,
    '2-right': 3,
    '3-left':  4,
    '3-right': 2,
    '4-left':  'whole',
    '4-right': 3,
  };

  const board = document.getElementById('board');
  let currentQuad = 1;

  function zoomTo(quadNumber) {
    currentQuad = quadNumber;
    board.style.transformOrigin = ORIGIN[quadNumber];
    board.style.transform = 'scale(2)';
  }

  function zoomOut() {
    currentQuad = null;
    board.style.transform = 'scale(1)';
  }

  function goToDestination(ownQuad, destination) {
    if (destination === 'whole') {
      if (currentQuad === null) {
        zoomTo(ownQuad);
      } else {
        zoomOut();
      }
      return;
    }
    zoomTo(destination);
  }

  document.querySelectorAll('.arrow-hit').forEach(hit => {
    const quadNumber = parseInt(hit.closest('.quad').dataset.quad, 10);
    const side = hit.dataset.side;
    const key = `${quadNumber}-${side}`;
    const destination = ARROW_DESTINATION[key];

    hit.addEventListener('click', () => {
      goToDestination(quadNumber, destination);
    });
  });

  const photoUnit = document.getElementById('slide1PhotoUnit');
  const photoHit = photoUnit.querySelector('.paper-hit');
  let photoState = 0;
  photoHit.addEventListener('click', () => {
    if (photoState === 0) {
      photoState = 1;
      photoUnit.classList.add('is-swinging');
      photoUnit.addEventListener('animationend', () => {
        photoUnit.classList.remove('is-swinging');
      }, { once: true });
    } else if (photoState === 1) {
      photoState = 2;
      photoUnit.classList.add('has-fallen');
    }
  });

  // Pink stickies: front always opens first (already enforced physically —
  // it sits on top and covers back's hit-zone until it peels away). But
  // closing had no equivalent rule, so front could flatten back down on
  // top of a still-open back sticky. Fix: lock front's hit-zone shut
  // whenever back is currently peeled, same .is-locked pattern already
  // used for the quad 3 yellow sticky. Forces close order to back → front.
  const pinkFrontUnit = document.getElementById('slide2PinkFront');
  const pinkBackUnit = document.getElementById('slide2PinkBack');
  const pinkFrontHit = pinkFrontUnit.querySelector('.roll-hit');
  const pinkBackHit = pinkBackUnit.querySelector('.roll-hit');

  function updatePinkFrontLock() {
    pinkFrontHit.classList.toggle('is-locked', pinkBackUnit.classList.contains('is-peeled'));
  }

  pinkFrontHit.addEventListener('click', function () {
    pinkFrontUnit.classList.toggle('is-peeled');
  });
  pinkBackHit.addEventListener('click', function () {
    pinkBackUnit.classList.toggle('is-peeled');
    updatePinkFrontLock();
  });

  const paperUnit = document.getElementById('slide3PaperUnit');
  const paperHit = paperUnit.querySelector('.paper-hit');
  const clipUnit = document.getElementById('slide3ClipUnit');
  const yellowHit = document.querySelector('#slide3Yellow .roll-hit');
  let paperState = 0;
  paperHit.addEventListener('click', () => {
    if (paperState === 0) {
      paperState = 1;
      paperUnit.classList.add('is-swinging');
      paperUnit.addEventListener('animationend', () => {
        paperUnit.classList.remove('is-swinging');
      }, { once: true });
    } else if (paperState === 1) {
      paperState = 2;
      paperUnit.classList.add('has-fallen');
      clipUnit.classList.add('has-fallen');
      yellowHit.classList.remove('is-locked');
    }
  });
  yellowHit.addEventListener('click', function () {
    document.getElementById('slide3Yellow').classList.toggle('is-peeled');
  });

  board.style.transition = 'none';
  board.style.transformOrigin = ORIGIN[1];
  board.style.transform = 'scale(2)';
  board.offsetHeight;
  board.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
</script>

<!-- ▼▼▼ TEMPORARY LABEL-EDITOR TOOL SCRIPT — delete this whole
     <script> block once labels are placed correctly. Nothing above
     this comment depends on it. Now wires up BOTH .sticky-label and
     .arrow-label elements identically. ▼▼▼ -->
<script>
(function () {
  const toggleBtn = document.getElementById('labelEditorToggle');
  const exportBtn = document.getElementById('labelExportBtn');
  const output = document.getElementById('labelExportOutput');

  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('label-edit-mode');
  });

  document.querySelectorAll('.sticky-label, .arrow-label').forEach(label => {
    const handle = label.querySelector('.label-resize-handle');
    let dragging = false, resizing = false;
    let startX, startY, startLeft, startTop, startW, startH;

    label.addEventListener('pointerdown', (e) => {
      if (!document.body.classList.contains('label-edit-mode')) return;
      if (e.target === handle) return;
      dragging = true;
      label.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      startLeft = parseFloat(label.style.left);
      startTop = parseFloat(label.style.top);
    });

    handle.addEventListener('pointerdown', (e) => {
      if (!document.body.classList.contains('label-edit-mode')) return;
      e.stopPropagation();
      resizing = true;
      handle.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      startW = parseFloat(label.style.width);
      startH = parseFloat(label.style.height);
    });

    label.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = label.parentElement.getBoundingClientRect(); // quad's or arrow-hit's own box
      const dxPct = (e.clientX - startX) / rect.width * 100;
      const dyPct = (e.clientY - startY) / rect.height * 100;
      label.style.left = (startLeft + dxPct) + '%';
      label.style.top = (startTop + dyPct) + '%';
    });

    handle.addEventListener('pointermove', (e) => {
      if (!resizing) return;
      const rect = label.parentElement.getBoundingClientRect();
      const dxPct = (e.clientX - startX) / rect.width * 100;
      const dyPct = (e.clientY - startY) / rect.height * 100;
      label.style.width = Math.max(5, startW + dxPct) + '%';
      label.style.height = Math.max(5, startH + dyPct) + '%';
    });

    function endDrag() { dragging = false; resizing = false; }
    label.addEventListener('pointerup', endDrag);
    label.addEventListener('pointercancel', endDrag);
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  });

  exportBtn.addEventListener('click', () => {
    const lines = Array.from(document.querySelectorAll('.sticky-label, .arrow-label')).map(label => {
      const name = label.dataset.label || '(unnamed)';
      return `${name}: left:${label.style.left}; top:${label.style.top}; width:${label.style.width}; height:${label.style.height};`;
    });
    output.textContent = lines.join('\n');
    output.classList.add('visible');
  });
})();
</script>
<!-- ▲▲▲ END TEMPORARY LABEL-EDITOR TOOL SCRIPT ▲▲▲ -->

</body>
</html>
