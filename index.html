<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corkboard navigation test</title>
<link rel="preload" href="fonts/BoldMoldHandwriting-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: 'BoldMoldHandwriting';
    src: url('fonts/BoldMoldHandwriting-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: block;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  .viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .board {
    width: 100%;
    height: 100%;
    background-image: url('images/corkboard.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    transform: scale(1);
    transform-origin: 0% 0%;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .quad {
    position: absolute;
    width: 50%;
    height: 50%;
  }
  .quad[data-quad="1"] { top: 0;   left: 0; }
  .quad[data-quad="2"] { top: 0;   left: 50%; }
  .quad[data-quad="3"] { top: 50%; left: 50%; }
  .quad[data-quad="4"] { top: 50%; left: 0; }

  :root { --bottom-row-lift: 8%; }
  .quad[data-quad="3"], .quad[data-quad="4"] {
    top: calc(50% - var(--bottom-row-lift));
  }

  .quad img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transform: scale(0.92);
    transform-origin: center center;
  }

  .arrow-hit {
    position: absolute;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arrow-hit .arrow-label {
    font-family: 'BoldMoldHandwriting', sans-serif;
    font-size: 35px;
    color: rgba(34, 34, 34, 0.75);
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  .arrow-hit .arrow-label.is-hidden-label {
    opacity: 0;
  }

  .photo-unit {
    position: absolute;
    inset: 0;
    cursor: pointer;
    pointer-events: auto;
    transform-origin: 50% 8%;
  }
  .photo-unit img {
    pointer-events: none;
  }
  .photo-unit.is-swinging {
    animation: photo-swing 0.6s ease-in-out;
  }
  .photo-unit.has-fallen {
    animation: photo-fall 0.7s cubic-bezier(0.55, 0, 0.85, 0.4) forwards;
    pointer-events: none;
  }
  @keyframes photo-swing {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(6deg); }
    50%  { transform: rotate(-5deg); }
    75%  { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
  }
  .fall-unit {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transform-origin: 50% 8%;
  }
  .fall-unit.has-fallen {
    animation: photo-fall 0.7s cubic-bezier(0.55, 0, 0.85, 0.4) forwards;
  }
  @keyframes photo-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(140%) rotate(35deg); opacity: 0; }
  }

  /* roll-unit: back to inset:0 so the artwork renders full-size and
     in place, exactly as before. pointer-events is now none on the
     unit itself — only its .roll-hit child (sized to the real drawn
     note) receives clicks, so it no longer swallows clicks meant for
     "Back" or anything else in the quad. */
  .roll-unit {
    position: absolute;
    inset: 0;
    cursor: pointer;
    pointer-events: none;
    transform-origin: 50% 22%;
    transform: scaleY(1) skewX(0deg);
    transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .roll-unit img {
    pointer-events: none;
  }
  .roll-unit.is-peeled {
    transform: scaleY(0.18) skewX(-6deg);
  }
  .roll-unit.is-peeled {
    z-index: 10;
  }

  /* Real click target for each pink sticky — sized/positioned to the
     drawn note itself, not the whole quad. Nudge these percentages
     while looking at the live page if they don't line up exactly. */
  .roll-unit .roll-hit {
    position: absolute;
    left: 52%;
    top: 25%;
    width: 38%;
    height: 71%;
    pointer-events: auto;
  }

  .roll-unit .roll-hit.is-locked {
    pointer-events: none;
  }

  #slide3Yellow .roll-hit {
    left: 16%;
    top: 30%;
    width: 34%;
    height: 40%;
  }

  .sticky-label {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'BoldMoldHandwriting', sans-serif;
    font-size: 28px;
    color: rgba(34, 34, 34, 0.85);
    pointer-events: none;
    user-select: none;
    line-height: 1.15;
  }

  .arrow-hit[data-side="left"]  { top: 70%; left: 8%;  width: 18%; height: 14%; }
  .arrow-hit[data-side="right"] { top: 70%; right: 8%; width: 18%; height: 14%; }

  .quad[data-quad="1"] .arrow-hit[data-side="left"] {
    left: 23%; top: 14%; width: 21%; height: 9%;
  }
  .quad[data-quad="1"] .arrow-hit[data-side="right"] {
    left: 74%; top: 15%; width: 23%; height: 13%; right: auto;
  }
  .quad[data-quad="2"] .arrow-hit[data-side="left"] {
    left: 10%; top: 16%; width: 22%; height: 11%;
  }
  .quad[data-quad="2"] .arrow-hit[data-side="right"] {
    left: 82%; top: 53%; width: 6%; height: 40%; right: auto;
  }
  .quad[data-quad="3"] .arrow-hit[data-side="right"] {
    left: 60%; top: 14%; width: 22%; height: 13%; right: auto;
  }
  .quad[data-quad="3"] .arrow-hit[data-side="left"] {
    left: 8%; top: 14%; width: 24%; height: 11%;
  }
  .quad[data-quad="4"] .arrow-hit[data-side="left"] {
    left: 10%; top: 13%; width: 24%; height: 13%;
  }
  .quad[data-quad="4"] .arrow-hit[data-side="right"] {
    left: 67%; top: 13%; width: 24%; height: 12%; right: auto;
  }

  .quad[data-quad="2"] .arrow-hit[data-side="right"] .arrow-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="board" id="board">
    <div class="quad" data-quad="1">
      <img src="images/slide1-torn-paper-notebook.png" alt="">
      <img src="images/slide1-pin-blue.png" alt="">
      <img src="animations/slide1-anim1.png" alt="">
      <div class="photo-unit" id="slide1PhotoUnit">
        <img src="images/slide1-torn-paper-photo.png" alt="">
        <img src="images/slide1-photo.png" alt="">
      </div>
      <img src="images/slide1-pin-yellow.png" alt="">
      <img src="images/slide1-sticky-arrow-left.png" alt="">
      <img src="images/slide1-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label is-hidden-label">Board</span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Next</span></div>
    </div>
    <div class="quad" data-quad="2">
      <img src="animations/slide2-anim2.png" alt="">
      <img src="images/slide2-tape.png" alt="">
      <img src="images/slide2-sticky-arrow-right.png" alt="">
      <img src="images/slide2-sticky-blue.png" alt="">
      <div class="sticky-label" style="left:10%; top:22%; width:36%; height:60%;">Book Participation</div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Next</span></div>
      <div class="roll-unit" id="slide2PinkBack">
        <img src="images/slide2-sticky-pink-back.png" alt="">
        <div class="roll-hit"></div>
        <div class="sticky-label" style="left:52%; top:25%; width:38%; height:71%;">Brazilian Citizen Labs</div>
      </div>
      <div class="roll-unit" id="slide2PinkFront">
        <img src="images/slide2-sticky-pink-front.png" alt="">
        <div class="roll-hit"></div>
      </div>
      <img src="images/slide2-sticky-arrow-left.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label">Back</span></div>
    </div>
    <div class="quad" data-quad="3">
      <img src="images/slide3-torn-paper-anim4.png" alt="">
      <img src="images/slide3-tape.png" alt="">
      <div class="roll-unit" id="slide3Yellow">
        <img src="images/slide3-sticky-yellow.png" alt="">
        <div class="roll-hit is-locked"></div>
        <div class="sticky-label" style="left:16%; top:30%; width:34%; height:40%;">Electoral Observation Project</div>
      </div>
      <div class="photo-unit" id="slide3PaperUnit">
        <img src="images/slide3-torn-paper-scribble.png" alt="">
      </div>
      <div class="fall-unit" id="slide3ClipUnit">
        <img src="images/slide3-paperclip.png" alt="">
      </div>
      <img src="images/slide3-sticky-green.png" alt="">
      <div class="sticky-label" style="left:56%; top:22%; width:36%; height:60%;">Selected Rough Dialogues</div>
      <img src="images/slide3-sticky-arrow-left.png" alt="">
      <img src="images/slide3-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label">Next</span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Back</span></div>
    </div>
    <div class="quad" data-quad="4">
      <img src="images/slide4-sticky-magenta.png" alt="">
      <div class="sticky-label" style="left:8%; top:20%; width:36%; height:55%;">MYOOZ Inc</div>
      <img src="images/slide4-sticky-purple.png" alt="">
      <div class="sticky-label" style="left:56%; top:20%; width:36%; height:55%;">HR Index</div>
      <img src="images/slide4-sticky-arrow-left.png" alt="">
      <img src="images/slide4-sticky-arrow-right.png" alt="">
      <div class="arrow-hit" data-side="left"><span class="arrow-label is-hidden-label">Board</span></div>
      <div class="arrow-hit" data-side="right"><span class="arrow-label">Back</span></div>
    </div>
  </div>
</div>

<script>
  const liftPercent = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--bottom-row-lift')
  ) || 0;
  const bottomRowTop = 50 - liftPercent;
  const bottomRowOriginY = 2 * bottomRowTop;

  const ORIGIN = {
    1: '0% 0%',
    2: '100% 0%',
    3: `100% ${bottomRowOriginY}%`,
    4: `0% ${bottomRowOriginY}%`,
  };

  const ARROW_DESTINATION = {
    '1-left':  'whole',
    '1-right': 2,
    '2-left':  1,
    '2-right': 3,
    '3-left':  4,
    '3-right': 2,
    '4-left':  'whole',
    '4-right': 3,
  };

  const board = document.getElementById('board');
  let currentQuad = 1;

  function zoomTo(quadNumber) {
    currentQuad = quadNumber;
    board.style.transformOrigin = ORIGIN[quadNumber];
    board.style.transform = 'scale(2)';
  }

  function zoomOut() {
    currentQuad = null;
    board.style.transform = 'scale(1)';
  }

  function goToDestination(ownQuad, destination) {
    if (destination === 'whole') {
      if (currentQuad === null) {
        zoomTo(ownQuad);
      } else {
        zoomOut();
      }
      return;
    }
    zoomTo(destination);
  }

  document.querySelectorAll('.arrow-hit').forEach(hit => {
    const quadNumber = parseInt(hit.closest('.quad').dataset.quad, 10);
    const side = hit.dataset.side;
    const key = `${quadNumber}-${side}`;
    const destination = ARROW_DESTINATION[key];

    hit.addEventListener('click', () => {
      goToDestination(quadNumber, destination);
    });
  });

  const photoUnit = document.getElementById('slide1PhotoUnit');
  let photoState = 0;
  photoUnit.addEventListener('click', () => {
    if (photoState === 0) {
      photoState = 1;
      photoUnit.classList.add('is-swinging');
      photoUnit.addEventListener('animationend', () => {
        photoUnit.classList.remove('is-swinging');
      }, { once: true });
    } else if (photoState === 1) {
      photoState = 2;
      photoUnit.classList.add('has-fallen');
    }
  });

  document.querySelector('#slide2PinkFront .roll-hit').addEventListener('click', function () {
    document.getElementById('slide2PinkFront').classList.toggle('is-peeled');
  });
  document.querySelector('#slide2PinkBack .roll-hit').addEventListener('click', function () {
    document.getElementById('slide2PinkBack').classList.toggle('is-peeled');
  });

  const paperUnit = document.getElementById('slide3PaperUnit');
  const clipUnit = document.getElementById('slide3ClipUnit');
  const yellowHit = document.querySelector('#slide3Yellow .roll-hit');
  let paperState = 0;
  paperUnit.addEventListener('click', () => {
    if (paperState === 0) {
      paperState = 1;
      paperUnit.classList.add('is-swinging');
      paperUnit.addEventListener('animationend', () => {
        paperUnit.classList.remove('is-swinging');
      }, { once: true });
    } else if (paperState === 1) {
      paperState = 2;
      paperUnit.classList.add('has-fallen');
      clipUnit.classList.add('has-fallen');
      yellowHit.classList.remove('is-locked');
    }
  });
  yellowHit.addEventListener('click', function () {
    document.getElementById('slide3Yellow').classList.toggle('is-peeled');
  });

  board.style.transition = 'none';
  board.style.transformOrigin = ORIGIN[1];
  board.style.transform = 'scale(2)';
  board.offsetHeight;
  board.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
</script>

</body>
</html>
