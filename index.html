<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corkboard navigation test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* the zoom effect needs a fixed viewport, no page scroll */
  }

  /* ---- Same background setup that already works — untouched ---- */
  .viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .board {
    width: 100%;
    height: 100%;
    background-image: url('images/corkboard.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    transform: scale(1) translate(0%, 0%);
    transform-origin: 0% 0%; /* fixed at top-left always — the sliding
                                 motion now comes from translate(), not
                                 from swapping the origin per quadrant */
    transition: transform 0.6s ease;
  }

  /* ---- The 4 clickable quadrants ---- */
  .quad {
    position: absolute;
    width: 50%;
    height: 50%;
    cursor: pointer;
    /* Uncomment the line below while testing, to see the quadrant
       boundaries. Delete it once you're happy with the zoom areas. */
    /* outline: 2px dashed red; */
  }
  .quad[data-quad="1"] { top: 0;   left: 0; }    /* top-left */
  .quad[data-quad="2"] { top: 0;   left: 50%; }  /* top-right */
  .quad[data-quad="3"] { top: 50%; left: 50%; }  /* bottom-right */
  .quad[data-quad="4"] { top: 50%; left: 0; }    /* bottom-left */

  /* Both quad boxes stay their true, even 50/50 size — nothing here
     resizes or scales anything, so your PNGs stay exactly as made.
     The bottom row is moved up as a group with a plain position shift
     only. One variable controls how far; raise it to move further up,
     lower it to move less. */
  :root { --bottom-row-lift: 8%; }
  .quad[data-quad="3"], .quad[data-quad="4"] {
    top: calc(50% - var(--bottom-row-lift));
  }

  /* Every element image is quadrant-sized (Photoshop-exported to match
     the quad exactly), so each one just fills its .quad edge-to-edge.
     Stacking order = DOM order below: later element = visually on top.
     No manual positioning per element — the artwork's own transparency
     already places things correctly within that quadrant canvas. */
  .quad img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill; /* switch to "contain" if any PNG isn't an exact
                          pixel match for the quadrant */
    pointer-events: none; /* let clicks pass through to the .quad's own
                              zoom-toggle handler, except where noted */
    transform: scale(0.92); /* shrinks each element a bit so it doesn't
                                touch the quadrant edges — tweak this one
                                number to adjust breathing room everywhere
                                at once */
    transform-origin: center center;
  }

  /* Nav arrows are now real clickable buttons — matched by filename in
     JS below (anything with "-left" or "-right" in its src). They get
     their own pointer-events and sit above everything else in the
     quad so taps land on them instead of triggering the quad's zoom. */
  .quad img.nav-btn {
    pointer-events: auto;
    z-index: 20;
    cursor: pointer;
  }

  /* ---- Simple prev/next controls, shown only while zoomed in ---- */
  .nav-controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 12px;
    z-index: 10;
  }
  .nav-controls.is-visible { display: flex; }

  .nav-controls button {
    font-family: sans-serif;
    font-size: 16px;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="board" id="board">
    <div class="quad" data-quad="1">
      <img src="images/slide1-torn-paper-notebook.png" alt="">
      <img src="images/slide1-pin-blue.png" alt="">
      <img src="animations/slide1-anim1.png" alt="">
      <img src="images/slide1-torn-paper-photo.png" alt="">
      <img src="images/slide1-photo.png" alt="">
      <img src="images/slide1-pin-yellow.png" alt="">
      <img class="nav-btn" src="images/slide1-sticky-arrow-left.png" alt="">
      <img class="nav-btn" src="images/slide1-sticky-arrow-right.png" alt="">
    </div>
    <div class="quad" data-quad="2">
      <img src="animations/slide2-anim2.png" alt="">
      <img src="images/slide2-tape.png" alt="">
      <img src="images/slide2-sticky-pink-back.png" alt="">
      <img src="images/slide2-sticky-pink-front.png" alt="">
      <img src="images/slide2-sticky-blue.png" alt="">
      <img class="nav-btn" src="images/slide2-sticky-arrow-left.png" alt="">
      <img class="nav-btn" src="images/slide2-sticky-arrow-right.png" alt="">
    </div>
    <div class="quad" data-quad="3">
      <img src="images/slide3-torn-paper-anim4.png" alt="">
      <img src="images/slide3-tape.png" alt="">
      <img src="images/slide3-sticky-yellow.png" alt="">
      <img src="images/slide3-torn-paper-scribble.png" alt="">
      <img src="images/slide3-paperclip.png" alt="">
      <img src="images/slide3-sticky-green.png" alt="">
      <img class="nav-btn" src="images/slide3-sticky-arrow-left.png" alt="">
      <img class="nav-btn" src="images/slide3-sticky-arrow-right.png" alt="">
    </div>
    <div class="quad" data-quad="4">
      <img src="images/slide4-sticky-magenta.png" alt="">
      <img src="images/slide4-sticky-purple.png" alt="">
      <img class="nav-btn" src="images/slide4-sticky-arrow-left.png" alt="">
      <img class="nav-btn" src="images/slide4-sticky-arrow-right.png" alt="">
    </div>
  </div>
</div>

<div class="nav-controls" id="navControls">
  <button id="prevBtn" type="button">&larr; Prev</button>
  <button id="wholeBtn" type="button">Whole view</button>
  <button id="nextBtn" type="button">Next &rarr;</button>
</div>

<script>
  // Navigation order: 1 top-left → 2 top-right → 3 bottom-right → 4 bottom-left.
  const ORDER = [1, 2, 3, 4];

  // Per-quadrant, per-side arrow behavior. The physical board has the
  // bottom row flowing right-to-left to continue the loop, so "forward"
  // sits on the left for quads 3/4 instead of the right — this table is
  // just the map of that, read directly off what you specified.
  const ARROW_ACTIONS = {
    1: { left: 'whole', right: 'next' },
    2: { left: 'back',  right: 'next' },
    3: { left: 'next',  right: 'back' },
    4: { left: 'whole', right: 'back' },
  };

  // Reads the quadrant's real top-left position (as a % of the board)
  // so the zoom can slide the camera there instead of jump-cutting via
  // transform-origin. Reuses --bottom-row-lift so quads 3/4 line up
  // with the same shifted position the CSS already applies to them.
  const liftPercent = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--bottom-row-lift')
  ) || 0;
  const bottomRowTop = 50 - liftPercent; // e.g. 42

  const QUAD_POS = {
    1: { x: 0,  y: 0 },
    2: { x: 50, y: 0 },
    3: { x: 50, y: bottomRowTop },
    4: { x: 0,  y: bottomRowTop },
  };

  const ZOOM_SCALE = 2;

  const board = document.getElementById('board');
  const navControls = document.getElementById('navControls');
  let currentQuad = null; // null = whole-view (not zoomed into anything)

  function applyTransform() {
    if (currentQuad === null) {
      board.style.transform = 'scale(1) translate(0%, 0%)';
      return;
    }
    const pos = QUAD_POS[currentQuad];
    // translate is expressed as a % of the board's own size, and since
    // the board is always 100vw/100vh, -pos.x% / -pos.y% shifts the
    // camera by exactly that quadrant's real offset — giving a true
    // slide toward the corner rather than a jump.
    board.style.transform = `scale(${ZOOM_SCALE}) translate(${-pos.x}%, ${-pos.y}%)`;
  }

  function zoomTo(quadNumber) {
    currentQuad = quadNumber;
    applyTransform();
    navControls.classList.add('is-visible');
  }

  function zoomOut() {
    currentQuad = null;
    applyTransform();
    navControls.classList.remove('is-visible');
  }

  function step(direction) {
    if (currentQuad === null) return; // only meaningful while zoomed in
    const i = ORDER.indexOf(currentQuad);
    const nextIndex = (i + direction + ORDER.length) % ORDER.length;
    zoomTo(ORDER[nextIndex]);
  }

  function runAction(action) {
    if (action === 'whole') zoomOut();
    else if (action === 'next') step(1);
    else if (action === 'back') step(-1);
  }

  // Wire up each quad's own click-to-zoom (unchanged behavior).
  document.querySelectorAll('.quad').forEach(quad => {
    quad.addEventListener('click', () => {
      const quadNumber = parseInt(quad.dataset.quad, 10);
      if (currentQuad === quadNumber) {
        zoomOut();
      } else {
        zoomTo(quadNumber);
      }
    });
  });

  // Wire up the arrow images themselves — matched by "-left"/"-right"
  // in their filename, mapped through ARROW_ACTIONS per quad.
  document.querySelectorAll('.quad img.nav-btn').forEach(img => {
    const quad = img.closest('.quad');
    const quadNumber = parseInt(quad.dataset.quad, 10);
    const side = img.src.includes('-left') ? 'left'
               : img.src.includes('-right') ? 'right'
               : null;
    if (!side) return; // filename didn't match either pattern — skip silently

    const action = ARROW_ACTIONS[quadNumber]?.[side];
    if (!action) return;

    img.addEventListener('click', (e) => {
      e.stopPropagation(); // don't also trigger the quad's own zoom-toggle
      runAction(action);
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => step(1));
  document.getElementById('prevBtn').addEventListener('click', () => step(-1));
  document.getElementById('wholeBtn').addEventListener('click', zoomOut);
</script>

</body>
</html>
