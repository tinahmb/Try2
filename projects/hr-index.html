  <div id="placementReadout"></div>
  <script>
    function makeDraggable(el) {
      let offsetX = 0, offsetY = 0, dragging = false;
      let resizing = false, startW = 0, startH = 0, startX = 0, startY = 0;
      const handle = el.querySelector('.resize-handle');

      function startDrag(clientX, clientY) {
        dragging = true;
        const rect = el.getBoundingClientRect();
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
      }
      function moveDrag(clientX, clientY) {
        if (!dragging) return;
        const parentRect = el.offsetParent.getBoundingClientRect();
        const newLeft = clientX - offsetX - parentRect.left;
        const newTop = clientY - offsetY - parentRect.top;
        el.style.left = `${Math.round(newLeft)}px`;
        el.style.top = `${Math.round(newTop)}px`;
        updateReadout();
      }
      function endDrag() { dragging = false; }

      function startResize(clientX, clientY) {
        resizing = true;
        startW = el.offsetWidth;
        startH = el.offsetHeight;
        startX = clientX;
        startY = clientY;
      }
      function moveResize(clientX, clientY) {
        if (!resizing) return;
        const newW = startW + (clientX - startX);
        const newH = startH + (clientY - startY);
        el.style.width = `${Math.max(40, Math.round(newW))}px`;
        el.style.height = `${Math.max(20, Math.round(newH))}px`;
        updateReadout();
      }
      function endResize() { resizing = false; }

      el.addEventListener('mousedown', e => {
        if (e.target === handle) return;
        if (el.tagName === 'A') e.preventDefault();
        startDrag(e.clientX, e.clientY);
      });
      document.addEventListener('mousemove', e => {
        moveDrag(e.clientX, e.clientY);
        moveResize(e.clientX, e.clientY);
      });
      document.addEventListener('mouseup', () => { endDrag(); endResize(); });

      el.addEventListener('touchstart', e => {
        if (e.target === handle) return;
        const t = e.touches[0];
        startDrag(t.clientX, t.clientY);
      }, { passive: true });
      document.addEventListener('touchmove', e => {
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
        moveResize(t.clientX, t.clientY);
      }, { passive: true });
      document.addEventListener('touchend', () => { endDrag(); endResize(); });

      if (handle) {
        handle.addEventListener('mousedown', e => {
          startResize(e.clientX, e.clientY);
          e.stopPropagation();
          e.preventDefault();
        });
        handle.addEventListener('touchstart', e => {
          const t = e.touches[0];
          startResize(t.clientX, t.clientY);
          e.stopPropagation();
        }, { passive: true });
      }
    }

    function updateReadout() {
      const ids = ['bubble1', 'bubble2', 'bubble3', 'linkTool', 'linkSubstack'];
      let out = '';
      ids.forEach(id => {
        const el = document.getElementById(id);
        out += `${id} → top: ${el.style.top || el.offsetTop + 'px'}  left: ${el.style.left || el.offsetLeft + 'px'}  w: ${el.offsetWidth}px  h: ${el.offsetHeight}px\n`;
      });
      document.getElementById('placementReadout').textContent = out;
    }

    document.querySelectorAll('.draggable').forEach(makeDraggable);
    updateReadout();
  </script>
  <!-- ===== END TEMPORARY ===== -->

  <script>
    const spiralLeftPages = [
      'livro-povos-originarios.html',
      'book-participation.html',
      'electoral-observation-project.html',
      'myooz-inc.html'
    ];
    const currentPage = window.location.pathname.split('/').pop();
    if (spiralLeftPages.includes(currentPage)) {
      document.body.classList.add('spiral-left');
    } else {
      document.body.classList.add('spiral-right');
    }
  </script>
